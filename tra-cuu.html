<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sổ Liên Lạc Điện Tử</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-width: 420px; width: 100%; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #1a73e8; margin: 0; font-size: 20px; font-weight: 700; text-transform: uppercase; }
        .header p { color: #5f6368; font-size: 12px; margin-top: 4px; }

        .card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .card-title { font-weight: bold; color: #1a73e8; font-size: 14px; border-bottom: 2px solid #e8f0fe; padding-bottom: 6px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        
        .info-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
        .info-label { color: #5f6368; }
        .info-value { font-weight: 600; color: #202124; text-align: right; }

        .grade-item, .attendance-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #eee; font-size: 13px; }
        .attendance-list { max-height: 250px; overflow-y: auto; }
        
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge-present { background-color: #e6f4ea; color: #137333; }
        .badge-late { background-color: #fff3cd; color: #856404; }
        .badge-permission { background-color: #cce5ff; color: #004085; }
        .badge-absent { background-color: #fce8e6; color: #c5221f; }
        .score-val { font-weight: bold; color: #d93025; font-size: 14px; }

        .error-box { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; padding: 15px; border-radius: 10px; text-align: center; font-weight: 600; font-size: 14px; }
        .loading { text-align: center; padding: 30px 0; color: #1a73e8; font-weight: 600; font-size: 14px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>SỔ LIÊN LẠC ĐIỆN TỬ</h2>
        <p>Tra cứu thông tin & kết quả học tập</p>
    </div>

    <div id="loading" class="loading">⏳ Đang tải dữ liệu học sinh...</div>
    <div id="error" class="error-box hidden"></div>

    <div id="content" class="hidden">
        <!-- 1. THÔNG TIN HỌC SINH -->
        <div class="card">
            <div class="card-title">👤 THÔNG TIN HỌC SINH</div>
            <div class="info-item"><span class="info-label">Mã học sinh:</span><span class="info-value" id="stMaHS">---</span></div>
            <div class="info-item"><span class="info-label">Họ và tên:</span><span class="info-value" id="stName">---</span></div>
            <div class="info-item"><span class="info-label">Ngày sinh:</span><span class="info-value" id="stDob">---</span></div>
            <div class="info-item"><span class="info-label">Nơi ở:</span><span class="info-value" id="stAddress">---</span></div>
            <div class="info-item"><span class="info-label">Tên thánh, bố hoặc mẹ:</span><span class="info-value" id="stParent">---</span></div>
            <div class="info-item"><span class="info-label">Lớp:</span><span class="info-value" id="stClass">---</span></div>
            <div class="info-item"><span class="info-label">Số điện thoại:</span><span class="info-value" id="stPhone">---</span></div>
        </div>

        <!-- 2. KẾT QUẢ HỌC TẬP -->
        <div class="card">
            <div class="card-title">📊 KẾT QUẢ HỌC TẬP</div>
            <div id="gradesList"></div>
        </div>

        <!-- 3. ĐIỂM DANH CHUYÊN CẦN -->
        <div class="card">
            <div class="card-title">📌 ĐIỂM DANH CHUYÊN CẦN</div>
            <div class="attendance-list" id="attendanceList"></div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQAMz4NP80kRnS23GXcHayjPgtvo1UKbtFeIzxh_X8JzkJ33LrrsQXSrttGe1JabYiiQ/exec";

    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const maHS = urlParams.get('ma') || urlParams.get('maHS');

        if (!maHS) {
            showError("❌ Không tìm thấy mã học sinh trên đường dẫn!");
            return;
        }

        fetch(`${SCRIPT_URL}?ma=${encodeURIComponent(maHS)}`)
        .then(res => res.json())
        .then(data => {
            document.getElementById("loading").classList.add("hidden");

            if (data.status === "success") {
                // Đổ thông tin học sinh
                document.getElementById("stMaHS").innerText = data.student.maHS || "---";
                document.getElementById("stName").innerText = data.student.name || "---";
                document.getElementById("stDob").innerText = data.student.dob || "---";
                document.getElementById("stAddress").innerText = data.student.address || "---";
                document.getElementById("stParent").innerText = data.student.parentName || "---";
                document.getElementById("stClass").innerText = data.student.className || "---";
                document.getElementById("stPhone").innerText = data.student.phone || "---";

                // Đổ Điểm số
                const gradesDiv = document.getElementById("gradesList");
                gradesDiv.innerHTML = "";
                if (data.grades && data.grades.length > 0) {
                    data.grades.forEach(g => {
                        gradesDiv.innerHTML += `
                            <div class="grade-item">
                                <span>${g.subject}:</span>
                                <span class="score-val">${g.score}</span>
                            </div>
                        `;
                    });
                } else {
                    gradesDiv.innerHTML = "<div style='text-align:center; color:#777; padding:8px;'>Chưa có dữ liệu điểm số.</div>";
                }

                // Đổ Điểm danh chuyên cần
                const listDiv = document.getElementById("attendanceList");
                listDiv.innerHTML = "";
                if (data.attendance && data.attendance.length > 0) {
                    data.attendance.forEach(item => {
                        let badgeClass = "badge-absent";
                        let statusText = item.status;

                        if (statusText === "Có mặt") badgeClass = "badge-present";
                        else if (statusText === "Đi muộn") badgeClass = "badge-late";
                        else if (statusText === "Nghỉ phép") badgeClass = "badge-permission";

                        listDiv.innerHTML += `
                            <div class="attendance-item">
                                <span>Ngày ${item.date}:</span>
                                <span class="badge ${badgeClass}">${statusText}</span>
                            </div>
                        `;
                    });
                } else {
                    listDiv.innerHTML = "<div style='text-align:center; color:#777; padding:8px;'>Chưa có dữ liệu điểm danh.</div>";
                }

                document.getElementById("content").classList.remove("hidden");
            } else {
                showError("❌ " + data.message);
            }
        })
        .catch(() => showError("❌ Lỗi kết nối máy chủ! Vui lòng thử lại sau."));
    };

    function showError(msg) {
        document.getElementById("loading").classList.add("hidden");
        const errDiv = document.getElementById("error");
        errDiv.innerText = msg;
        errDiv.classList.remove("hidden");
    }
</script>

</body>
</html>
