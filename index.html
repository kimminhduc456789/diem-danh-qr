<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Học Sinh</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-width: 420px; width: 100%; }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; margin-bottom: 20px; font-size: 20px; font-weight: 700; text-transform: uppercase; }
        
        .user-info { background: #e8f0fe; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; color: #1967d2; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

        .date-badge { text-align: center; background: #f1f3f4; padding: 8px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #3c4043; margin-bottom: 15px; }

        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; font-size: 13px; color: #444; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1.5px solid #dadce0; border-radius: 8px; font-size: 15px; background: #fff; outline: none; }
        
        button.btn-primary { width: 100%; padding: 13px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }

        /* KHUNG CAMERA CHUẨN GỌN GÀNG */
        #scanner-wrapper { 
            margin-top: 10px; 
            border-radius: 16px; 
            overflow: hidden; 
            background: #000; 
            position: relative; 
            width: 100%;
            height: 250px;
            border: 4px solid #ccc;
            transition: all 0.2s ease-in-out;
        }

        #reader { width: 100%; height: 100%; border: none !important; }
        #reader video { 
            width: 100% !important; 
            height: 250px !important; 
            object-fit: cover !important; 
            border-radius: 12px; 
        }

        /* ẨN TOÀN BỘ LỚP MỜ VÀ 4 GÓC CỦA THƯ VIỆN */
        #reader__scan_region, 
        #reader__scan_region * { 
            background: transparent !important; 
            border: none !important; 
            box-shadow: none !important;
        }
        #reader__dashboard { display: none !important; }

        /* HIỆU ỨNG VIỀN ĐỔI MÀU KHI QUÉT */
        #scanner-wrapper.scan-success {
            border-color: #28a745 !important;
            box-shadow: 0 0 18px rgba(40, 167, 69, 0.8) !important;
        }
        #scanner-wrapper.scan-error {
            border-color: #dc3545 !important;
            box-shadow: 0 0 18px rgba(220, 53, 69, 0.8) !important;
        }

        #result { margin-top: 15px; padding: 14px; border-radius: 10px; text-align: center; font-weight: 600; font-size: 14px; display: none; line-height: 1.4; }
        .success { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
        .error { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
        .info { background-color: #e8f0fe; color: #1967d2; border: 1px solid #d2e3fc; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Điểm Danh Học Sinh</h2>

    <!-- KHỐI ĐĂNG NHẬP -->
    <div id="loginSection">
        <div class="form-group">
            <label>Email Người Điểm Danh:</label>
            <input type="email" id="userEmail" placeholder="Nhập email của bạn...">
        </div>
        <button class="btn-primary" onclick="login()">Đăng Nhập</button>
    </div>

    <!-- KHỐI QUÉT MÃ -->
    <div id="attendanceSection" class="hidden">
        <div class="user-info">
            <span>👤 <strong id="userName"></strong></span>
            <button class="btn-logout" onclick="logout()">Thoát</button>
        </div>

        <div class="date-badge">
            📅 Ngày điểm danh: <span id="currentDateStr" style="color: #1a73e8;"></span>
        </div>

        <div id="scanner-wrapper">
            <div id="reader"></div>
        </div>

        <div id="result"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQAMz4NP80kRnS23GXcHayjPgtvo1UKbtFeIzxh_X8JzkJ33LrrsQXSrttGe1JabYiiQ/exec";
    
    let html5QrCode = null;
    let isProcessing = false;
    let currentUserEmail = "";

    window.onload = function() {
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("attendanceSection").classList.add("hidden");
    };

    function login() {
        const email = document.getElementById("userEmail").value.trim();
        if (!email) {
            alert("Vui lòng nhập Email!");
            return;
        }

        const url = `${SCRIPT_URL}?action=login&email=${encodeURIComponent(email)}`;

        fetch(url)
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                currentUserEmail = email;
                showAttendanceSection(data.name);
            } else {
                alert(data.message);
            }
        })
        .catch(err => {
            alert("Không thể kết nối máy chủ! Vui lòng thử lại.");
        });
    }

    async function logout() {
        await stopScanner();
        currentUserEmail = "";
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("attendanceSection").classList.add("hidden");
        document.getElementById("userEmail").value = "";
    }

    function showAttendanceSection(name) {
        document.getElementById("userName").innerText = name;

        const today = new Date();
        const dateStr = today.getDate() + "/" + (today.getMonth() + 1) + "/" + today.getFullYear();
        document.getElementById("currentDateStr").innerText = dateStr;

        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("attendanceSection").classList.remove("hidden");
        
        setTimeout(() => {
            startScanner();
        }, 300);
    }

    async function startScanner() {
        await stopScanner();

        html5QrCode = new Html5Qrcode("reader");

        // Cấu hình quét ổn định chuẩn 10 FPS (Đảm bảo 100% thiết bị đều nhận dạng mượt)
        const config = { 
            fps: 10
        };

        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).catch(err => {
            showResult("❌ Không mở được camera. Vui lòng cấp quyền truy cập!", "error");
        });
    }

    async function stopScanner() {
        if (html5QrCode) {
            try {
                if (html5QrCode.isScanning) {
                    await html5QrCode.stop();
                }
                html5QrCode.clear();
            } catch (e) {
                console.log("Lỗi dừng camera:", e);
            }
            html5QrCode = null;
        }
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;

        showResult("⏳ Đang ghi nhận điểm danh...", "info");

        const url = `${SCRIPT_URL}?action=attendance&email=${encodeURIComponent(currentUserEmail)}&qrData=${encodeURIComponent(decodedText)}`;

        fetch(url)
        .then(res => res.json())
        .then(data => {
            const wrapper = document.getElementById("scanner-wrapper");
            
            if (data.status === "success") {
                showResult(`🎉 THÀNH CÔNG: <strong>${data.name}</strong> (${data.maHS})`, "success");
                wrapper.classList.remove("scan-error");
                wrapper.classList.add("scan-success");
            } else {
                showResult(data.message, "error");
                wrapper.classList.remove("scan-success");
                wrapper.classList.add("scan-error");
            }

            // Đợi 1.5 giây để đổi màu viền và nhận mã tiếp theo
            setTimeout(() => { 
                wrapper.classList.remove("scan-success", "scan-error");
                isProcessing = false; 
            }, 1500);
        })
        .catch(() => {
            showResult("❌ Lỗi kết nối mạng!", "error");
            setTimeout(() => { isProcessing = false; }, 1500);
        });
    }

    function showResult(msg, type) {
        const resDiv = document.getElementById("result");
        resDiv.innerHTML = msg;
        resDiv.className = type;
        resDiv.style.display = "block";
    }
</script>

</body>
</html>
