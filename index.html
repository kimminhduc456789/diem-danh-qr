<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điểm Danh QR Code</title>
    <!-- Thư viện giải mã QR siêu nhẹ -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin: 0;
        }
        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            max-width: 450px; 
            width: 100%; 
            text-align: center; 
            box-sizing: border-box;
        }
        input, select, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            box-sizing: border-box; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 15px; 
        }
        button { 
            background-color: #007bff; 
            color: white; 
            font-weight: bold; 
            border: none; 
            cursor: pointer; 
        }
        .hidden { display: none; }
        
        #video-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            height: 250px;
            margin: 10px auto;
            border: 3px solid #007bff;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* KHU VỰC THÔNG BÁO */
        #status-box { 
            margin: 12px 0; 
            padding: 10px;
            border-radius: 8px;
            font-weight: bold; 
            font-size: 16px;
            background-color: #e9ecef;
            color: #333;
            transition: all 0.3s ease;
        }
        .status-success {
            background-color: #d4edda !important;
            color: #155724 !important;
            border: 1px solid #c3e6cb;
        }
        .status-error {
            background-color: #f8d7da !important;
            color: #721c24 !important;
            border: 1px solid #f5c6cb;
        }
        .status-loading {
            background-color: #fff3cd !important;
            color: #856404 !important;
            border: 1px solid #ffeeba;
        }

        ul { 
            list-style: none; 
            padding: 0; 
            text-align: left; 
            max-height: 200px; 
            overflow-y: auto; 
        }
        li { 
            padding: 10px; 
            margin-bottom: 6px; 
            border-radius: 6px; 
            font-size: 14px; 
        }
        .li-success { background: #e2f0d9; }
        .li-error { background: #fce4d6; }
    </style>
</head>
<body>

<!-- MÀN HÌNH ĐĂNG NHẬP -->
<div id="login-section" class="card">
    <h2>Đăng Nhập Điểm Danh</h2>
    <p>Nhập email được cấp quyền để tiếp tục</p>
    <input type="email" id="user-email" placeholder="Nhập Gmail của bạn..." required>
    <button onclick="handleLogin()">Xác Nhận Đăng Nhập</button>
    <div id="login-msg" style="color: red; margin-top: 10px;"></div>
</div>

<!-- MÀN HÌNH QUÉT MÃ QR -->
<div id="app-section" class="card hidden">
    <h2>Điểm Danh QR Code</h2>
    <p>Xin chào: <strong id="user-display"></strong></p>
    
    <label for="week-select" style="display:block; text-align:left; font-weight:bold;">Chọn tuần điểm danh:</label>
    <select id="week-select">
        <option value="Tuần 1">Tuần 1</option>
        <option value="Tuần 2">Tuần 2</option>
        <option value="Tuần 3">Tuần 3</option>
        <option value="Tuần 4">Tuần 4</option>
    </select>

    <!-- Khung thông báo trạng thái -->
    <div id="status-box">Đang mở camera...</div>
    
    <div id="video-container">
        <video id="video" playsinline></video>
    </div>
    <canvas id="canvas" class="hidden"></canvas>

    <h3 style="text-align: left; margin-top: 20px;">Lịch sử quét:</h3>
    <ul id="result-list"></ul>
    
    <button onclick="logout()" style="background-color: #dc3545; margin-top: 15px;">Đăng xuất</button>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQAMz4NP80kRnS23GXcHayjPgtvo1UKbtFeIzxh_X8JzkJ33LrrsQXSrttGe1JabYiiQ/exec";

    let currentUserEmail = "";
    const scannedSet = new Set();
    let videoStream = null;
    let isScanning = false;

    function handleLogin() {
        const email = document.getElementById('user-email').value.trim();
        const msgDiv = document.getElementById('login-msg');
        if (!email) {
            msgDiv.innerText = "Vui lòng nhập Email!";
            return;
        }

        msgDiv.innerText = "Đang kiểm tra quyền...";

        fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "login", email: email })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                currentUserEmail = email;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-display').innerText = data.name;
                startCamera();
            } else {
                msgDiv.innerText = data.message;
            }
        })
        .catch(() => {
            msgDiv.innerText = "Lỗi kết nối máy chủ!";
        });
    }

    function startCamera() {
        const video = document.getElementById('video');
        
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => {
            videoStream = stream;
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            isScanning = true;
            setStatus("Sẵn sàng quét mã QR...", "normal");
            requestAnimationFrame(tick);
        })
        .catch(err => {
            setStatus("⚠️ Không mở được camera!", "error");
        });
    }

    function tick() {
        if (!isScanning) return;

        const video = document.getElementById('video');
        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            if (code && code.data) {
                onQRCodeScanned(code.data);
            }
        }
        requestAnimationFrame(tick);
    }

    function setStatus(text, type) {
        const statusBox = document.getElementById('status-box');
        statusBox.innerText = text;
        statusBox.className = ""; // Reset class
        
        if (type === "success") statusBox.classList.add('status-success');
        else if (type === "error") statusBox.classList.add('status-error');
        else if (type === "loading") statusBox.classList.add('status-loading');
        else statusBox.id = "status-box";
    }

    function onQRCodeScanned(qrData) {
        if (scannedSet.has(qrData)) return;
        scannedSet.add(qrData);

        const week = document.getElementById('week-select').value;
        setStatus("⏳ Đang kiểm tra dữ liệu...", "loading");

        fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({
                action: "attendance",
                email: currentUserEmail,
                qrData: qrData,
                tuan: week
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                // ĐIỂM DANH THÀNH CÔNG -> Hiện ô màu xanh lá
                setStatus(`✅ ${data.name} (${data.maHS}) - Điểm danh thành công!`, "success");
                addToList(data.maHS, data.name, week, true);
            } else {
                // ĐÃ ĐIỂM DANH RỒI HOẶC BỊ LỖI -> Hiện ô màu đỏ báo lỗi
                setStatus(data.message, "error");
                addToList(qrData, data.message, week, false);
            }
        })
        .catch(() => {
            setStatus("❌ Lỗi kết nối mạng!", "error");
        });

        // Sau 3 giây gỡ khóa để có thể quét học sinh tiếp theo
        setTimeout(() => {
            scannedSet.delete(qrData);
        }, 3000);
    }

    function addToList(maHS, titleInfo, tuan, isSuccess) {
        const list = document.getElementById('result-list');
        const item = document.createElement('li');
        const now = new Date().toLocaleTimeString('vi-VN');
        
        if (isSuccess) {
            item.className = "li-success";
            item.innerHTML = `✅ <strong>${titleInfo}</strong> (${maHS}) - <em>${tuan}</em> [${now}]`;
        } else {
            item.className = "li-error";
            item.innerHTML = `❌ <strong>${titleInfo}</strong> - <em>${tuan}</em> [${now}]`;
        }
        list.insertBefore(item, list.firstChild);
    }

    function logout() {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
        }
        location.reload();
    }
</script>

</body>
</html>
