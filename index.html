<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Học Sinh</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); max-width: 420px; width: 100%; }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; margin-bottom: 20px; font-size: 20px; font-weight: 700; text-transform: uppercase; }
        
        .user-info { background: #e8f0fe; padding: 10px 14px; border-radius: 10px; margin-bottom: 15px; font-size: 13px; color: #1967d2; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; font-size: 13px; color: #444; display: block; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #dadce0; border-radius: 8px; font-size: 15px; background: #fff; outline: none; }
        
        button.btn-primary { width: 100%; padding: 13px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }

        /* KHUNG CAMERA CHỮ NHẬT NẰM NGANG TIẾT KIỆM DIỆN TÍCH */
        #scanner-wrapper { margin-top: 15px; border-radius: 12px; overflow: hidden; background: #000; position: relative; }
        #reader { width: 100%; border: none !important; }
        
        /* Ép tỉ lệ khung hình chuẩn ngang 16:9 */
        #reader video { 
            width: 100% !important; 
            height: 180px !important; 
            object-fit: cover !important; 
            border-radius: 12px; 
        }

        #result { margin-top: 15px; padding: 14px; border-radius: 10px; text-align: center; font-weight: 600; font-size: 14px; display: none; line-height: 1.4; }
        .success { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
        .error { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
        .info { background-color: #e8f0fe; color: #1967d2; border: 1px solid #d2e3fc; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Điểm Danh Học Sinh</h2>

    <!-- KHỐI ĐĂNG NHẬP -->
    <div id="loginSection">
        <div class="form-group">
            <label>Email Người Điểm Danh:</label>
            <input type="email" id="userEmail" placeholder="kimminhduc270203@gmail.com">
        </div>
        <button class="btn-primary" onclick="login()">Đăng Nhập</button>
    </div>

    <!-- KHỐI ĐIỂM DANH -->
    <div id="attendanceSection" class="hidden">
        <div class="user-info">
            <span>👤 <strong id="userName"></strong></span>
            <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        </div>

        <div class="form-group">
            <label>Ngày Điểm Danh:</label>
            <select id="selectTuan">
                <optgroup label="Tháng 9">
                    <option value="6/9">6/9</option>
                    <option value="13/9">13/9</option>
                    <option value="20/9">20/9</option>
                    <option value="27/9">27/9</option>
                </optgroup>
                <optgroup label="Tháng 10">
                    <option value="4/10">4/10</option>
                    <option value="11/10">11/10</option>
                    <option value="18/10">18/10</option>
                    <option value="25/10">25/10</option>
                </optgroup>
            </select>
        </div>

        <!-- Khung Camera nằm ngang -->
        <div id="scanner-wrapper">
            <div id="reader"></div>
        </div>

        <div id="result"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQAMz4NP80kRnS23GXcHayjPgtvo1UKbtFeIzxh_X8JzkJ33LrrsQXSrttGe1JabYiiQ/exec";
    
    let html5QrCode = null;
    let isProcessing = false;

    window.onload = function() {
        const savedEmail = localStorage.getItem("userEmail");
        const savedName = localStorage.getItem("userName");
        if (savedEmail && savedName) {
            showAttendanceSection(savedName);
        }
    };

    function login() {
        const email = document.getElementById("userEmail").value.trim();
        if (!email) {
            alert("Vui lòng nhập Email!");
            return;
        }

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "login", email: email })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                localStorage.setItem("userEmail", email);
                localStorage.setItem("userName", data.name);
                showAttendanceSection(data.name);
            } else {
                alert(data.message);
            }
        })
        .catch(() => alert("Lỗi kết nối máy chủ!"));
    }

    function logout() {
        stopScanner();
        localStorage.clear();
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("attendanceSection").classList.add("hidden");
    }

    function showAttendanceSection(name) {
        document.getElementById("userName").innerText = name;
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("attendanceSection").classList.remove("hidden");
        
        startScanner();
    }

    function startScanner() {
        if (html5QrCode) {
            stopScanner();
        }

        html5QrCode = new Html5Qrcode("reader");

        // Khung quét nằm ngang chuẩn kích thước 260px x 130px
        const config = { fps: 10, qrbox: { width: 260, height: 130 } };

        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess
        ).catch(err => {
            showResult("❌ Hãy cho phép truy cập Camera để quét mã!", "error");
        });
    }

    function stopScanner() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                html5QrCode.clear();
            }).catch(err => console.log(err));
        }
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;

        showResult("⏳ Đang ghi nhận điểm danh...", "info");

        const email = localStorage.getItem("userEmail");
        const tuan = document.getElementById("selectTuan").value;

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "attendance",
                email: email,
                tuan: tuan,
                qrData: decodedText
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                showResult(`🎉 Điểm danh THÀNH CÔNG!<br><strong>${data.name}</strong> (${data.maHS})`, "success");
            } else {
                showResult(data.message, "error");
            }
            setTimeout(() => { isProcessing = false; }, 2500);
        })
        .catch(() => {
            showResult("❌ Lỗi kết nối mạng!", "error");
            setTimeout(() => { isProcessing = false; }, 2500);
        });
    }

    function showResult(msg, type) {
        const resDiv = document.getElementById("result");
        resDiv.innerHTML = msg;
        resDiv.className = type;
        resDiv.style.display = "block";
    }
</script>

</body>
</html>
