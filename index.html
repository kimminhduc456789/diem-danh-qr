<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm Danh Học Sinh</title>
    <!-- Thư viện quét mã QR Html5-QRCode -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Arial, sans-serif; background-color: #eef2f5; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; width: 100%; box-sizing: border-box; }
        h2 { text-align: center; color: #007bff; margin-top: 0; font-size: 22px; text-transform: uppercase; }
        
        .user-info { background: #e8f4fd; padding: 10px 14px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; color: #0056b3; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #007bff; }
        .btn-logout { background: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button.btn-primary { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.btn-primary:hover { background: #0056b3; }

        #reader { width: 100%; margin-top: 15px; border-radius: 8px; overflow: hidden; }
        #result { margin-top: 15px; padding: 12px; border-radius: 6px; text-align: center; font-weight: bold; font-size: 15px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Điểm Danh QR Code</h2>

    <!-- KHỐI ĐĂNG NHẬP -->
    <div id="loginSection">
        <div class="form-group">
            <label>Nhập Email Giáo Viên / Huynh Trưởng:</label>
            <input type="email" id="userEmail" placeholder="ví dụ: kimminhduc270203@gmail.com">
        </div>
        <button class="btn-primary" onclick="login()">Đăng Nhập</button>
    </div>

    <!-- KHỐI ĐIỂM DANH -->
    <div id="attendanceSection" class="hidden">
        <div class="user-info">
            <span>Xin chào: <strong id="userName"></strong></span>
            <button class="btn-logout" onclick="logout()">Đăng xuất</button>
        </div>

        <div class="form-group">
            <label>Chọn Ngày Điểm Danh:</label>
            <select id="selectTuan">
                <!-- Danh sách ngày khớp chính xác tiêu đề trên Google Sheets -->
                <optgroup label="Tháng 9">
                    <option value="6/9">6/9</option>
                    <option value="13/9">13/9</option>
                    <option value="20/9">20/9</option>
                    <option value="27/9">27/9</option>
                </optgroup>
                <optgroup label="Tháng 10">
                    <option value="4/10">4/10</option>
                    <option value="11/10">11/10</option>
                    <option value="18/10">18/10</option>
                    <option value="25/10">25/10</option>
                </optgroup>
            </select>
        </div>

        <button class="btn-primary" id="btnStartScan" onclick="startScanner()">📷 Mở Camera Quét Mã</button>
        
        <div id="reader"></div>
        <div id="result"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQAMz4NP80kRnS23GXcHayjPgtvo1UKbtFeIzxh_X8JzkJ33LrrsQXSrttGe1JabYiiQ/exec";
    
    let html5QrcodeScanner = null;
    let isProcessing = false;

    // Kiểm tra đăng nhập
    window.onload = function() {
        const savedEmail = localStorage.getItem("userEmail");
        const savedName = localStorage.getItem("userName");
        if (savedEmail && savedName) {
            showAttendanceSection(savedName);
        }
    };

    function login() {
        const email = document.getElementById("userEmail").value.trim();
        if (!email) {
            alert("Vui lòng nhập Email!");
            return;
        }

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: "login", email: email })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                localStorage.setItem("userEmail", email);
                localStorage.setItem("userName", data.name);
                showAttendanceSection(data.name);
            } else {
                alert(data.message);
            }
        })
        .catch(err => {
            alert("Lỗi kết nối máy chủ!");
        });
    }

    function logout() {
        localStorage.clear();
        if(html5QrcodeScanner) {
            html5QrcodeScanner.clear();
        }
        document.getElementById("loginSection").classList.remove("hidden");
        document.getElementById("attendanceSection").classList.add("hidden");
    }

    function showAttendanceSection(name) {
        document.getElementById("userName").innerText = name;
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("attendanceSection").classList.remove("hidden");
    }

    function startScanner() {
        document.getElementById("btnStartScan").classList.add("hidden");
        
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 250 } }
        );
        
        html5QrcodeScanner.render(onScanSuccess);
    }

    function onScanSuccess(decodedText) {
        if (isProcessing) return;
        isProcessing = true;

        showResult("⏳ Đang xử lý điểm danh...", "success");

        const email = localStorage.getItem("userEmail");
        const tuan = document.getElementById("selectTuan").value;

        fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({
                action: "attendance",
                email: email,
                tuan: tuan,
                qrData: decodedText
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                showResult(`✅ Thành công! ${data.name} (${data.maHS})`, "success");
            } else {
                showResult(data.message, "error");
            }
            setTimeout(() => { isProcessing = false; }, 2500);
        })
        .catch(err => {
            showResult("❌ Lỗi gửi dữ liệu!", "error");
            setTimeout(() => { isProcessing = false; }, 2500);
        });
    }

    function showResult(msg, type) {
        const resDiv = document.getElementById("result");
        resDiv.innerText = msg;
        resDiv.className = type;
        resDiv.style.display = "block";
    }
</script>

</body>
</html>
